$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://a-townchain.org/schemas/aurora-action-request-v1.yaml"
title: Aurora Action Request
type: object
additionalProperties: false
required:
  - principal
  - capability
  - action
  - scope
  - approval
properties:
  principal:
    type: string
    minLength: 1
  capability:
    type: string
    minLength: 1
  action:
    type: string
    minLength: 1
  scope:
    type: string
    minLength: 1
  approval:
    type: boolean
description: >
  Authorization request contract. Model output is never an authorization
  source. Unknown or mismatched authorization context MUST fail closed.
