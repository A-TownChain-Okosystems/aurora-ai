name: Aurora AI Code Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: read-all
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate Rust modules
        if: ${{ hashFiles('modules/**/Cargo.toml') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find modules -name Cargo.toml -not -path '*/target/*' -print | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Rust manifests found; validation skipped."
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            echo "Validating ${manifest}"
            cargo fmt --manifest-path "${manifest}" -- --check
            cargo test --manifest-path "${manifest}"
            cargo clippy --manifest-path "${manifest}" --all-targets -- -D warnings
          done
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python modules
        if: ${{ hashFiles('modules/**/pyproject.toml', 'modules/**/requirements*.txt') != '' }}
        run: python -m compileall -q modules/atc-aurora-ai
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Node module
        if: ${{ hashFiles('modules/**/package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f modules/atc-aistudio/package.json ]; then
            echo "No atc-aistudio package.json; Node validation skipped."
            exit 0
          fi
          if [ -f modules/atc-aistudio/package-lock.json ]; then
            npm --prefix modules/atc-aistudio ci
          else
            npm --prefix modules/atc-aistudio install
          fi
          npm --prefix modules/atc-aistudio test --if-present
