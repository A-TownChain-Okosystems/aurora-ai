name: Aurora AI Code Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: read-all
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('modules/**/Cargo.toml') != '' }}
        with:
          components: rustfmt, clippy
      - name: Validate Rust modules
        if: ${{ hashFiles('modules/**/Cargo.toml') != '' }}
        shell: bash
        run: |
          set -e
          while IFS= read -r manifest; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest"
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done < <(find modules -name Cargo.toml -not -path '*/target/*' -print)
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('modules/atc-aurora-ai/pyproject.toml', 'modules/atc-aurora-ai/requirements*.txt') != '' }}
        with:
          python-version: '3.11'
      - name: Compile Python modules
        if: ${{ hashFiles('modules/atc-aurora-ai/pyproject.toml', 'modules/atc-aurora-ai/requirements*.txt') != '' }}
        run: python -m compileall -q modules/atc-aurora-ai
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('modules/atc-aistudio/package.json') != '' }}
        with:
          node-version: '20'
      - name: Validate Node module
        if: ${{ hashFiles('modules/atc-aistudio/package.json') != '' }}
        shell: bash
        run: |
          if [ -f modules/atc-aistudio/package-lock.json ]; then
            npm --prefix modules/atc-aistudio ci
          else
            npm --prefix modules/atc-aistudio install
          fi
          npm --prefix modules/atc-aistudio test --if-present
