name: ATC Test Suite
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  npm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: npm install + test/build (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            echo "=== npm in $d"
            (cd "$d" && npm install --no-audit --no-fund --silent)
            (cd "$d" && npm test --if-present --silent) || { echo "npm test FAILED in $d"; FAIL=1; }
            (cd "$d" && npm run build --if-present --silent) || { echo "npm build FAILED in $d"; FAIL=1; }
          done < <(find . -name package.json -not -path "*/archive/*" -not -path "*/node_modules/*" -not -path "*/.*/")
          exit $FAIL
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: pytest ueber alle Requirements-Module (SCR-0078)
        run: |
          set +e
          FAIL=0
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if ! (cd "$d" && grep -rql --include="*.py" "def test_" .); then
              echo "SKIP $d: keine Tests vorhanden"; continue
            fi
            echo "=== pytest in $d"
            (cd "$d" && pip install -q -r requirements.txt pytest && python -m pytest -q --no-header) \
              || { echo "pytest FAILED in $d"; FAIL=1; }
          done < <(find . -name requirements.txt -not -path "*/archive/*")
          exit $FAIL
      - name: Evidence-Bindung (SCR-0086 idempotentes test_run-Update je Lauf + hartes Push-Gate)
        if: success()
        run: |
          python3 - <<'PY'
          import os, datetime, re
          sha = os.environ["GITHUB_SHA"]
          rid = os.environ["GITHUB_RUN_ID"]
          wf  = os.environ.get("GITHUB_WORKFLOW", "ATC Test Suite")
          ts  = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p = ".atc/evidence/evidence.yaml"
          t = open(p, encoding="utf-8").read()
          t = re.sub(r"bound_commit: [^\n]*", "bound_commit: " + sha, t)
          block = ("test_run:\n"
                   "  workflow: " + wf + "\n"
                   "  run_id: " + rid + "\n"
                   "  commit: " + sha + "\n"
                   "  timestamp: " + ts + "\n"
                   "  result: PASS\n"
                   "  runner: github-actions\n")
          if re.search(r"(?m)^test_run:\n(?:  [^\n]*\n)+", t):
              t = re.sub(r"(?m)^test_run:\n(?:  [^\n]*\n)+", block, t)
          else:
              t = t.rstrip() + "\n" + block
          open(p, "w", encoding="utf-8").write(t)
          PY
          git config user.name "Aurora-Bot"
          git config user.email "aurora@base44.ai"
          git add .atc/evidence/evidence.yaml
          git commit -m "chore(evidence): bound_commit + test_run aktualisiert (SCR-0086) [skip ci]" || echo "nichts zu committen"
          git push

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain auf stable festlegen
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable
          rustc --version
          cargo --version
      # Kein Root-Workspace: jedes Crate unter modules/ ist ein eigenes Paket und
      # wird einzeln geprueft. Ein Fehler in einem Crate laesst den Job scheitern,
      # aber erst nachdem alle Crates gelaufen sind, damit der Report vollstaendig
      # ist (set +e je Gate, Gesamtergebnis am Ende).
      # Formatierung: blockierend fuer die in diesem Lauf geaenderten Rust-Dateien,
      # informativ fuer den Altbestand. Grund: drei Crates (agents, localization,
      # memory) sind historisch nicht rustfmt-sauber. Ein blockierendes
      # `cargo fmt --check` ueber alles waere ab dem ersten Lauf rot, ohne dass eine
      # dieser Stellen etwas mit dem jeweiligen Auftrag zu tun haette. Dieselbe
      # Entscheidung wurde im frueheren Workflow `rust-module-validation.yml`
      # getroffen (Commit 7f1dcff, "ci: scope rustfmt gate to changed Rust files").
      - name: rustfmt auf geaenderten Rust-Dateien (blockierend)
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            basis="origin/$BASE_REF...HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${EVENT_BEFORE:-}" ] \
               && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            basis="$EVENT_BEFORE...HEAD"
          else
            echo "::notice::Kein begrenzter Aenderungsbereich, es werden alle Rust-Dateien geprueft."
            basis=""
          fi
          if [ -n "${basis:-}" ]; then
            mapfile -t dateien < <(git diff --name-only "$basis" -- '*.rs' | sort -u)
          else
            mapfile -t dateien < <(git ls-files '*.rs' | sort)
          fi
          if [ ${#dateien[@]} -eq 0 ]; then echo "keine Rust-Dateien geaendert"; exit 0; fi
          FAIL=0
          for datei in "${dateien[@]}"; do
            [ -f "$datei" ] || continue
            rustfmt --edition 2021 --check "$datei" || { echo "FMT FAILED $datei"; FAIL=1; }
          done
          exit $FAIL
      - name: rustfmt Vollpruefung je Crate (informativ, Altbestand)
        continue-on-error: true
        run: |
          set -euo pipefail
          for manifest in modules/*/Cargo.toml; do
            d="$(dirname "$manifest")"
            echo "=== fmt $d"
            (cd "$d" && cargo fmt --check) \
              || echo "::warning::rustfmt-Baseline in $d nicht sauber (Altbestand, nicht blockierend)"
          done
      - name: cargo clippy --all-targets -- -D warnings (jedes Crate)
        run: |
          set -euo pipefail
          FAIL=0
          for manifest in modules/*/Cargo.toml; do
            d="$(dirname "$manifest")"
            echo "=== clippy $d"
            (cd "$d" && cargo clippy --all-targets -- -D warnings) || { echo "CLIPPY FAILED in $d"; FAIL=1; }
          done
          exit $FAIL
      - name: cargo test (jedes Crate)
        run: |
          set -euo pipefail
          FAIL=0
          for manifest in modules/*/Cargo.toml; do
            d="$(dirname "$manifest")"
            echo "=== test $d"
            (cd "$d" && cargo test --quiet) || { echo "TEST FAILED in $d"; FAIL=1; }
          done
          exit $FAIL
