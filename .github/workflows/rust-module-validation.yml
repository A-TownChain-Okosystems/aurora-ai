name: Aurora AI Rust Module Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-rust-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-modules:
    name: Format, test, and lint Rust modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate every Rust module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find modules -name Cargo.toml -not -path '*/target/*' -print | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No Rust module Cargo.toml files found under modules/"
            exit 1
          fi
          printf 'Found %s Rust module manifest(s).\n' "${#manifests[@]}"
          for manifest in "${manifests[@]}"; do
            echo "::group::Rust format: ${manifest}"
            cargo fmt --manifest-path "${manifest}" -- --check
            echo "::endgroup::"
            echo "::group::Rust tests: ${manifest}"
            cargo test --manifest-path "${manifest}"
            echo "::endgroup::"
            echo "::group::Rust Clippy: ${manifest}"
            cargo clippy --manifest-path "${manifest}" --all-targets -- -D warnings
            echo "::endgroup::"
          done
