name: Aurora AI Rust Module Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-rust-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-modules:
    name: Format changed Rust files; test and lint all modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting of changed Rust files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            diff_base="origin/$BASE_REF...HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            diff_base="$EVENT_BEFORE...HEAD"
          else
            echo "::notice::Manual dispatch has no bounded change range; formatting gate checks all Rust files."
            mapfile -t rust_files < <(find modules -name '*.rs' -not -path '*/target/*' -print | sort)
            diff_base=""
          fi
          if [ -n "${diff_base:-}" ]; then
            mapfile -t rust_files < <(git diff --name-only "$diff_base" -- 'modules/**/*.rs' '*.rs' | sort -u)
          fi
          if [ "${#rust_files[@]}" -eq 0 ]; then
            echo "No changed Rust files; formatting gate is not applicable."
          else
            printf 'Checking formatting for %s Rust file(s).\n' "${#rust_files[@]}"
            for file in "${rust_files[@]}"; do
              [ -f "$file" ] || continue
              rustfmt --check --edition 2021 "$file"
            done
          fi

      - name: Test every Rust module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find modules -name Cargo.toml -not -path '*/target/*' -print | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No Rust module Cargo.toml files found under modules/"
            exit 1
          fi
          printf 'Found %s Rust module manifest(s).\n' "${#manifests[@]}"
          for manifest in "${manifests[@]}"; do
            echo "::group::Rust tests: ${manifest}"
            cargo test --manifest-path "${manifest}"
            echo "::endgroup::"
          done

      - name: Run Clippy on every Rust module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find modules -name Cargo.toml -not -path '*/target/*' -print | sort)
          for manifest in "${manifests[@]}"; do
            echo "::group::Rust Clippy: ${manifest}"
            cargo clippy --manifest-path "${manifest}" --all-targets -- -D warnings
            echo "::endgroup::"
          done
