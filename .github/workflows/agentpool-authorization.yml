name: Aurora AgentPool Authorization Tests
on:
  pull_request:
    paths:
      - "modules/atc-aurora-agents/**"
      - "modules/atc-aurora-core/**"
      - ".github/workflows/agentpool-authorization.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agentpool-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format AgentPool crate
        run: cargo fmt --manifest-path modules/atc-aurora-agents/Cargo.toml -- --check
      - name: Run AgentPool authorization tests
        run: cargo test --manifest-path modules/atc-aurora-agents/Cargo.toml --all-targets
      - name: Clippy AgentPool crate and dependencies
        run: cargo clippy --manifest-path modules/atc-aurora-agents/Cargo.toml --all-targets -- -D warnings
